# Keep only site-specific values. Other settings come from the pinned Reimu theme.
# See themes/hugo-theme-reimu/config/_default/params.yml for available options.
menu:
  - name: home
    url: ""
    icon: "f015"
  - name: archives
    url: archives
    icon: "f073"
  - name: about
    url: about
    icon: "f05a"
  - name: friend
    url: friend
    icon: "f007"

# Archives are grouped by year, so show only month and day in each entry.
monthFormat: "01-02"
author: Colin
email: # Override the theme's example address; contact links are in social.
description: "Colin 的个人博客，记录计算机技术、编程实践与生活。"
sidebar_description: "I want to get really rich"
subtitle:
  text: "Code & Life"
banner: "images/banner-colin.jpg"
avatar: "avatar.jpg"
cover: "/images/banner-colin.jpg"
excerpt_link: 阅读全文

footer:
  since: 2026
sidebar:
  position: left
social:
  email: mailto:colinchoudev@gmail.com
  github: https://github.com/ColinChouDev
widgets:
  - category
  - tagcloud
layout:
  max_width: 1500px
reimu_cursor:
  enable: false
icon_font: false
font:
  article:
    - JetBrains Mono
  code:
    - JetBrains Mono

comment:
  default: giscus
giscus:
  enable: true
  repo: ColinChouDev/ColinChouDev.github.io
  repoId: R_kgDOT2J-sg
  category: Announcements
  categoryId: DIC_kwDOT2J-ss4DDNRr
  mapping: pathname
  strict: 1

preloader:
  text: ""
firework:
  enable: false
injector:
  head_end: '<link rel="stylesheet" href="/css/colin-blog.css">'
pjax:
  enable: true
pangu:
  enable: true

internal_theme:
  light:
    --red-0: '#0066ff'
    --red-1: '#3399ff'
    --red-2: '#66b2ff'
    --red-3: '#99ccff'
    --red-4: '#cce6ff'
    --red-5: '#e6f2ff'
    --red-5-5: '#f2f8ff'
    --red-6: '#f7fbff'
    --color-red-6-shadow: 'rgba(78, 156, 255, 0.6)'
    --color-red-3-shadow: 'rgba(78, 156, 255, 0.3)'
  dark:
    --red-4: 'rgba(208, 228, 255, 0.5)'
    --red-5: 'rgba(228, 238, 255, 0.15)'
    --red-5-5: 'rgba(236, 243, 255, 0.05)'
    --red-6: 'rgba(243, 247, 255, 0.2)'
